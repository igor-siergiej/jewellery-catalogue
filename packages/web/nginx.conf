include /etc/nginx/mime.types;

# Structured access log: every field is a top-level JSON key so Loki can
# ingest with `| json` instead of regex parsing. `$request_time` is in
# seconds with millisecond resolution. `cf_ip` is Cloudflare's
# CF-Connecting-IP header (the real visitor IP); we fall back to the
# last public hop in X-Forwarded-For when Cloudflare isn't in front.
#
# The web dashboard reads `method`, `path`, `status`, `bytes`, `rt`,
# `referer`, `ua`, `cf_ip`, and `xff`; keep them stable.
log_format json_combined escape=json
    '{'
    '"ts":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"rt":$request_time,'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent",'
    '"cf_ip":"$http_cf_connecting_ip",'
    '"xff":"$proxy_add_x_forwarded_for"'
    '}';

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Known static asset paths that should never fall back to the SPA shell.
    # Without these, /.env, /.git/*, /wp-login.php, and friends are served
    # as index.html with a 200 status, which fools crawler-based scanners
    # and inflates the request count for the SPA.
    location = /sitemap.xml { return 404; }
    location = /favicon.ico { return 404; }
    location = /apple-touch-icon.png { return 404; }
    location = /robots.txt { try_files $uri =404; }
    location = /manifest.webmanifest { try_files $uri =404; }
    location ~* ^/\.well-known/ { return 404; }
    # Dotfiles (.env, .htaccess, .git, etc.) are never valid routes.
    location ~* /\.[^/]+(/|$) { return 404; }
    # Scanner probes: anything ending in a server-side extension the SPA
    # doesn't serve gets a real 404 instead of an index.html with 200.
    location ~* \.(php|asp|aspx|jsp|cgi|env|git/|gitignore|sql|bak|swp)$ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
